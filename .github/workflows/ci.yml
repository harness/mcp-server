name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node -e "import('@hono/node-server')"
      - run: pnpm build
      - run: pnpm npm-shrinkwrap:check
      - run: pnpm test
      - run: pnpm standards:check
      - run: pnpm typecheck
      - run: pnpm docs:check

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            toolsets: ""
            read_only: "false"
          - name: read-only
            toolsets: ""
            read_only: "true"
          - name: single-toolset
            toolsets: "pipelines"
            read_only: "false"
          - name: multi-toolset
            toolsets: "pipelines,repositories,services"
            read_only: "false"
          - name: opt-in-toolset
            toolsets: "+ai-evals"
            read_only: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: "Smoke test: ${{ matrix.name }}"
        run: node scripts/smoke-test.js
        env:
          HARNESS_TOOLSETS: ${{ matrix.toolsets }}
          HARNESS_READ_ONLY: ${{ matrix.read_only }}

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build container image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          pull: true
          tags: harness-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block fixable critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: harness-mcp-server:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Verify production image excludes package managers
        run: |
          set -euo pipefail
          for command in npm npx corepack pnpm yarn yarnpkg; do
            if docker run --rm --entrypoint "$command" harness-mcp-server:ci --version >/dev/null 2>&1; then
              echo "Production image unexpectedly contains $command" >&2
              exit 1
            fi
          done
      - name: Smoke test HTTP reachability and auth
        run: |
          container_id="$(docker run --detach \
            --publish 3000:3000 \
            --env HARNESS_MCP_MODE=multi-user \
            --env HARNESS_MCP_AUTH_TOKEN=ci-smoke-token \
            harness-mcp-server:ci)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container health endpoint did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3000/mcp)"
          test "$status" = "401"

  npm-consumer-adm-zip:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-npm-adm-zip.mjs
      - name: Assert --ignore-scripts leaves nested adm-zip vulnerable
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer" "$tgz"' EXIT
          npm install --global --prefix "$consumer" --omit=dev --ignore-scripts "$(pwd)/$tgz"
          pkg_root="$consumer/lib/node_modules/harness-mcp-v2"
          node --input-type=module -e "
            import { listInsecureAdmZipInstalls } from './scripts/adm-zip-security-lib.mjs';
            const insecure = listInsecureAdmZipInstalls(process.argv[1]);
            if (insecure.length > 0) {
              console.error('confirmed: --ignore-scripts skips adm-zip postinstall patch');
              process.exit(0);
            }
            console.error('expected insecure nested adm-zip with --ignore-scripts');
            process.exit(1);
          " "$pkg_root"
