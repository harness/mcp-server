apiVersion: v1
kind: Secret
metadata:
  name: harness-mcp-secret
  namespace: harness-mcp
  labels:
    app.kubernetes.io/name: harness-mcp-server
type: Opaque
stringData:
  # Replace with your actual Harness credentials and an independent MCP
  # transport bearer token before applying.
  HARNESS_API_KEY: "pat.REPLACE_ME.REPLACE_ME.REPLACE_ME"
  HARNESS_ACCOUNT_ID: "REPLACE_ME"
  HARNESS_MCP_AUTH_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_TOKEN"
  # At least 32 bytes, and the same value on every replica. A 2026-07-28
  # write confirmation minted on one pod is rejected on another pod without it.
  HARNESS_MCP_REQUEST_STATE_KEY: "REPLACE_WITH_32_PLUS_BYTE_RANDOM_SECRET"
